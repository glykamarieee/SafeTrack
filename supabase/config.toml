project_id = "safetrack"

# Guardian, admin and child-phone features are Postgres functions called with
# supabase.rpc(); see supabase/migrations. Only these remain edge functions.

[functions.generate-report]
verify_jwt = true

# Called by the Wear OS watch, which authenticates with its device token.
[functions.watch-pair]
verify_jwt = false

[functions.watch-ingest]
verify_jwt = false

# Scheduled jobs, authenticated with the x-cron-secret header.
[functions.sos-realert]
verify_jwt = false

[functions.scheduled-safety-scan]
verify_jwt = false
